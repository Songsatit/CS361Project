<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CS361 V3 Architecture</title>
  <desc id="desc">CS361 V3 architecture with API Gateway, authentication Lambda, logical curriculum service modules, RDS Proxy, MySQL, TU APIs and audit workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#64748b}.section{font:700 16px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif}.small{font:13px Arial,sans-serif}.box{filter:url(#shadow)}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f8fafc"/>
  <text x="70" y="62" class="title">CS361 V3 Architecture</text>
  <text x="70" y="94" class="subtitle">Secure access, role-based permissions and curriculum approval workflow</text>
  <rect x="50" y="125" width="1500" height="855" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="80" y="168" class="section">1. Client and API entry</text>
  <rect x="80" y="195" width="210" height="86" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" class="box"/><text x="185" y="231" text-anchor="middle" class="label" fill="#075985">Users</text><text x="185" y="257" text-anchor="middle" class="small" fill="#075985">Student · Instructor · Staff · Admin</text>
  <rect x="350" y="195" width="230" height="86" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" class="box"/><text x="465" y="231" text-anchor="middle" class="label" fill="#991b1b">Frontend</text><text x="465" y="257" text-anchor="middle" class="small" fill="#991b1b">AWS Amplify · role guard</text>
  <rect x="640" y="195" width="230" height="86" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2" class="box"/><text x="755" y="231" text-anchor="middle" class="label" fill="#9d174d">API Gateway</text><text x="755" y="257" text-anchor="middle" class="small" fill="#9d174d">HTTP API · CORS · routes</text>
  <path d="M290 238 H350 M580 238 H640" class="arrow"/>

  <text x="80" y="330" class="section">2. Lambda services (แยกตามหน้าที่)</text>
  <text x="80" y="354" class="small" fill="#64748b">ปัจจุบัน deploy เป็น 2 Lambda: AuthFunction และ CurriculumReadFunction; กล่องเส้นประคือโมดูลภายใน CurriculumReadFunction</text>
  <rect x="80" y="380" width="220" height="118" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" class="box"/><text x="190" y="417" text-anchor="middle" class="label" fill="#9a3412">AuthFunction</text><text x="190" y="444" text-anchor="middle" class="small" fill="#9a3412">TU Login / Profile</text><text x="190" y="468" text-anchor="middle" class="small" fill="#9a3412">ออก session + role</text>
  <rect x="350" y="365" width="1110" height="154" rx="16" fill="#fffaf5" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="375" y="392" class="small" font-weight="700" fill="#92400e">CurriculumReadFunction — logical service modules</text>
  <rect x="375" y="410" width="235" height="82" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" class="box"/><text x="492" y="442" text-anchor="middle" class="label" fill="#166534">Catalog Read</text><text x="492" y="466" text-anchor="middle" class="small" fill="#166534">courses · plans · curricula</text>
  <rect x="635" y="410" width="235" height="82" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" class="box"/><text x="752" y="442" text-anchor="middle" class="label" fill="#1d4ed8">Curriculum Editor</text><text x="752" y="466" text-anchor="middle" class="small" fill="#1d4ed8">draft · add · edit · move</text>
  <rect x="895" y="410" width="235" height="82" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" class="box"/><text x="1012" y="442" text-anchor="middle" class="label" fill="#991b1b">Workflow Approval</text><text x="1012" y="466" text-anchor="middle" class="small" fill="#991b1b">submit · approve · reject</text>
  <rect x="1155" y="410" width="280" height="82" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2" class="box"/><text x="1295" y="442" text-anchor="middle" class="label" fill="#334155">Audit &amp; Visibility</text><text x="1295" y="466" text-anchor="middle" class="small" fill="#334155">audit log · hide · version</text>
  <path d="M755 281 V330 H190 V380 M755 330 H905 V365" class="arrow"/>

  <text x="80" y="568" class="section">3. External services and data access</text>
  <rect x="80" y="610" width="250" height="88" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="box"/><text x="205" y="646" text-anchor="middle" class="label" fill="#92400e">TU REST API</text><text x="205" y="672" text-anchor="middle" class="small" fill="#92400e">Authentication · Student Profile</text>
  <rect x="425" y="610" width="270" height="88" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="box"/><text x="560" y="646" text-anchor="middle" class="label" fill="#1d4ed8">RDS Proxy</text><text x="560" y="672" text-anchor="middle" class="small" fill="#1d4ed8">pool connections · TLS boundary</text>
  <rect x="790" y="610" width="270" height="88" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="box"/><text x="925" y="646" text-anchor="middle" class="label" fill="#5b21b6">RDS MySQL</text><text x="925" y="672" text-anchor="middle" class="small" fill="#5b21b6">curriculum · courses · workflow</text>
  <rect x="1155" y="610" width="280" height="88" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" class="box"/><text x="1295" y="646" text-anchor="middle" class="label" fill="#3730a3">TypeScript Importer</text><text x="1295" y="672" text-anchor="middle" class="small" fill="#3730a3">npm run import · src/import.ts</text>
  <path d="M190 498 V610 M560 519 V610 M695 654 H790 M1295 519 V610" class="arrow"/>
  <text x="205" y="548" class="small" fill="#64748b">verify credentials</text><text x="720" y="596" class="small" fill="#64748b">SQL via proxy</text><text x="1165" y="730" class="small" fill="#64748b">ดึงข้อมูลจาก TU/Course Catalog แล้วเขียนเข้า RDS</text>

  <rect x="425" y="755" width="270" height="88" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2" class="box"/><text x="560" y="791" text-anchor="middle" class="label" fill="#334155">Secrets Manager</text><text x="560" y="817" text-anchor="middle" class="small" fill="#334155">DB credentials · TU key</text>
  <rect x="790" y="755" width="270" height="88" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" class="box"/><text x="925" y="791" text-anchor="middle" class="label" fill="#166534">Audit Log</text><text x="925" y="817" text-anchor="middle" class="small" fill="#166534">who · action · time · old/new</text>
  <path d="M560 698 V755 M925 698 V755" class="arrow"/>
  <text x="80" y="920" class="section">4. Main workflow</text><text x="80" y="950" class="small" fill="#475569">Admin creates draft → edits course structure → submits request → Staff reviews diff → approve/reject → approved version becomes public</text>
</svg>
