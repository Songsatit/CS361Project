<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CS361 V3 Architecture</title>
  <desc id="desc">V3 architecture showing TU Active Directory authentication, role-based access, Lambda, RDS Proxy, RDS MySQL, S3 raw data, workflow and audit log.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="70" y="65" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">CS361 V3 Architecture</text>
  <text x="70" y="98" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Secure access, role-based permissions and curriculum workflow</text>
  <rect x="50" y="130" width="1500" height="710" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="80" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">1. User request path</text>
  <rect x="80" y="215" width="170" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#075985">Users</text>
  <text x="165" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">Public / Student / Staff</text>
  <rect x="300" y="215" width="190" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">TU Auth API</text>
  <text x="395" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#92400e">AD /verify2 · student / staff</text>
  <rect x="540" y="215" width="200" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Frontend</text>
  <text x="640" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">AWS Amplify + role guard</text>
  <rect x="790" y="215" width="200" height="90" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="890" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9d174d">API Gateway</text>
  <text x="890" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9d174d">Public / protected routes</text>
  <rect x="1040" y="215" width="210" height="90" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Lambda API</text>
  <text x="1145" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">RBAC + business logic</text>
  <path d="M250 260 H300 M490 260 H540 M740 260 H790 M990 260 H1040" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">2. Database access</text>
  <rect x="520" y="425" width="260" height="95" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">RDS Proxy</text>
  <text x="650" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">Pools Lambda connections</text>
  <rect x="860" y="425" width="260" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b21b6">RDS MySQL</text>
  <text x="990" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">Curriculum database</text>
  <path d="M1145 305 V370 H650 V425" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M780 472 H860" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="805" y="457" font-family="Arial, sans-serif" font-size="13" fill="#64748b">SQL read / write</text>

  <rect x="1160" y="390" width="300" height="75" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1310" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">Curriculum Workflow</text>
  <text x="1310" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Draft → Review → Approved / Rejected</text>
  <rect x="1160" y="485" width="300" height="75" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="1310" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Audit Log</text>
  <text x="1310" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Who / What / When / Old-New value</text>
  <path d="M1250 305 V355 H1310 V390 M1310 465 V485" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1180" y="345" font-family="Arial, sans-serif" font-size="13" fill="#64748b">manage / record</text>

  <text x="80" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">3. External data import</text>
  <rect x="220" y="665" width="230" height="85" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">Course Catalog API</text>
  <text x="335" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">External source</text>
  <rect x="550" y="665" width="230" height="85" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="665" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#3730a3">Import / Sync Job</text>
  <text x="665" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3730a3">Validate and transform</text>
  <rect x="880" y="665" width="230" height="85" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">Amazon S3</text>
  <text x="995" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">Raw source data</text>
  <path d="M450 707 H550 M780 707 H880" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M665 665 V575 H990 V520" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="595" font-family="Arial, sans-serif" font-size="13" fill="#64748b">approved data → RDS</text>
</svg>
