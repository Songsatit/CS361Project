AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CS361 curriculum API (HTTP API + Lambda) backed by Amazon RDS MySQL, RDS Proxy optional

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1030  # optional proxy parameters default to empty strings when UseProxy=false

Parameters:
  DbHost:
    Type: String
    Description: RDS instance endpoint hostname. Lambda connects here directly when UseProxy=false
  DbInstanceIdentifier:
    Type: String
    Default: ''
    Description: RDS DB instance identifier to attach to the proxy (only needed when UseProxy=true)
  UseProxy:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Put RDS Proxy between Lambda and RDS. It costs about 22 USD per month, so keep it off unless testing it
  DbName:
    Type: String
    Default: curriculum
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbPort:
    Type: Number
    Default: 3306
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets that can reach the RDS instance
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to Lambda; allow it in the RDS security group on port 3306
  RdsProxySecurityGroupId:
    Type: String
    Default: ''
    Description: Security group for RDS Proxy (only needed when UseProxy=true)
  LambdaExecutionRoleArn:
    Type: String
    Description: Existing IAM execution role ARN for Lambda
  RdsProxyRoleArn:
    Type: String
    Default: ''
    Description: IAM role ARN trusted by rds.amazonaws.com that can read the database secret (only needed when UseProxy=true)
  TuApplicationKey:
    Type: String
    NoEcho: true
    Description: TU API Application-Key for Authentication Service
  CourseApiUrlCs:
    Type: String
    Default: ''
    Description: Google course API endpoint for CS
  CourseApiUrlCnc:
    Type: String
    Default: ''
    Description: Google course API endpoint for CNC
  TuAuthUrl:
    Type: String
    Default: https://restapi.tu.ac.th/api/v1/auth/Ad/verify2
  FrontendOrigin:
    Type: String
    Description: Origin of the deployed frontend, for example https://main.xxxx.amplifyapp.com (no trailing slash)
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign short-lived API access tokens
  DemoTeacherPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoInstructorPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoStaffPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoAdminPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  EnableDemoLogin:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  DemoStudent01PasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoStudent02PasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  GraduationSnapshotMaxAgeDays:
    Type: Number
    Default: 30
    Description: Days after which graduation grade data counts as stale (V4)
  CountSelfReportedGrades:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When true, grades a student entered count in the graduation check without staff review (the grade data is a mock). They stay labelled self-reported and unverified. Set false to count only verified rows.

  FunctionMemoryMb:
    Type: Number
    Default: 256
    Description: Lambda memory in MB (V6 tuning knob)
  FunctionTimeoutSeconds:
    Type: Number
    Default: 10
    Description: Lambda timeout in seconds. API Gateway HTTP API cuts requests at 30 seconds anyway
  ReadReservedConcurrency:
    Type: Number
    Default: 0
    Description: Reserved concurrency for the API function. 0 means no reservation. Needs a Lambda account limit above 100 plus the reserved amount
  AuthReservedConcurrency:
    Type: Number
    Default: 0
    Description: Reserved concurrency for the login function. 0 means no reservation
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: CloudWatch Logs retention for the Lambda functions
  ApiThrottleRate:
    Type: Number
    Default: 20
    Description: Default HTTP API steady-state requests per second
  ApiThrottleBurst:
    Type: Number
    Default: 50
    Description: Default HTTP API burst limit

Conditions:
  UseProxy: !Equals [!Ref UseProxy, 'true']
  HasReadReservation: !Not [!Equals [!Ref ReadReservedConcurrency, 0]]
  HasAuthReservation: !Not [!Equals [!Ref AuthReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: !Ref FunctionTimeoutSeconds
    MemorySize: !Ref FunctionMemoryMb
    Tags:
      Project: cs361
    Environment:
      Variables:
        DB_HOST: !If [UseProxy, !GetAtt CurriculumDbProxy.Endpoint, !Ref DbHost]
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        TU_APPLICATION_KEY: !Ref TuApplicationKey
        TU_AUTH_URL: !Ref TuAuthUrl
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        JWT_SECRET: !Ref JwtSecret
        JWT_ISSUER: cs361-curriculum-api
        JWT_AUDIENCE: cs361-frontend
        DB_TLS: 'true'
        DEMO_TEACHER_PASSWORD_HASH: !Ref DemoTeacherPasswordHash
        DEMO_INSTRUCTOR_PASSWORD_HASH: !Ref DemoInstructorPasswordHash
        DEMO_STAFF_PASSWORD_HASH: !Ref DemoStaffPasswordHash
        DEMO_ADMIN_PASSWORD_HASH: !Ref DemoAdminPasswordHash
        ENABLE_DEMO_LOGIN: !Ref EnableDemoLogin
        DEMO_STUDENT_01_PASSWORD_HASH: !Ref DemoStudent01PasswordHash
        DEMO_STUDENT_02_PASSWORD_HASH: !Ref DemoStudent02PasswordHash
        GRADUATION_SNAPSHOT_MAX_AGE_DAYS: !Ref GraduationSnapshotMaxAgeDays
        GRADUATION_COUNT_SELF_REPORTED: !Ref CountSelfReportedGrades

Resources:
  CurriculumDbSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseProxy
    Properties:
      Description: Credentials used by the CS361 RDS Proxy
      SecretString: !Sub '{"username":"${DbUser}","password":"${DbPassword}"}'

  CurriculumDbProxy:
    Type: AWS::RDS::DBProxy
    Condition: UseProxy
    Properties:
      DBProxyName: cs361-curriculum-proxy
      EngineFamily: MYSQL
      Auth:
        - AuthScheme: SECRETS
          IAMAuth: DISABLED
          SecretArn: !Ref CurriculumDbSecret
      RoleArn: !Ref RdsProxyRoleArn
      VpcSubnetIds: !Ref VpcSubnetIds
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroupId
      RequireTLS: true

  CurriculumDbProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: UseProxy
    Properties:
      DBProxyName: !Ref CurriculumDbProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref DbInstanceIdentifier
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50

  CurriculumApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
          - x-cs361-csrf
        AllowCredentials: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiThrottleBurst
        ThrottlingRateLimit: !Ref ApiThrottleRate

  ReadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-read'
      RetentionInDays: !Ref LogRetentionDays

  AuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-auth'
      RetentionInDays: !Ref LogRetentionDays

  CurriculumReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-read'
      ReservedConcurrentExecutions: !If [HasReadReservation, !Ref ReadReservedConcurrency, !Ref 'AWS::NoValue']
      LoggingConfig:
        LogGroup: !Ref ReadFunctionLogGroup
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.handler
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        CreateDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests
            Method: POST
        ListDraftChangeRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests
            Method: GET
        GetDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}
            Method: GET
        SaveDraftChangeItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/items
            Method: PUT
        SubmitDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/submit
            Method: POST
        DeleteDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}
            Method: DELETE
        CancelDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/cancel
            Method: POST
        DecideDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/decision
            Method: POST
        GetActivePlanForDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/active-plan
            Method: GET
        ListCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses
            Method: GET
        GetCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}
            Method: GET
        GetPrerequisites:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}/prerequisites
            Method: GET
        GetGraduationConditions:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/graduation-conditions
            Method: GET
        ListStudyPlans:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans
            Method: GET
        GetStudyPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans/{studyPlanId}
            Method: GET
        ListFaculties:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/faculties
            Method: GET
        ListDepartments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/departments
            Method: GET
        ListAuditLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/audit-logs
            Method: GET
        GetCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: GET
        ListCurricula:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula
            Method: GET
        UpdateCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: POST
        SetCurriculumVisibility:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/visibility
            Method: PATCH
        DeleteCurriculum:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}
            Method: DELETE
        DeleteCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseCode}
            Method: DELETE
        ListCurriculumChanges:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes
            Method: GET
        CreateCurriculumChange:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes
            Method: POST
        DecideCurriculumChange:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes/{changeId}/decision
            Method: POST
        GetMyGraduationCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me
            Method: GET
        ListAssignedGraduationStudents:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students
            Method: GET
        AssignGraduationStudent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments
            Method: POST
        ListGraduationAssignments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments
            Method: GET
        GetStudentContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/students/me/contact
            Method: GET
        UpdateStudentContact:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/students/me/contact
            Method: PATCH
        ListGraduationDirectory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/directory
            Method: GET
        RemoveGraduationStudent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments/{studentId}
            Method: DELETE
        AddSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/grades
            Method: POST
        UpdateSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/grades/{gradeRecordId}
            Method: PATCH
        DeleteSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/grades/{gradeRecordId}
            Method: DELETE
        SubmitGraduationGrades:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/submission
            Method: POST
        ReviewGraduationSubmission:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}/submission
            Method: POST
        CategorizeGraduationGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}/grades/{gradeRecordId}/category
            Method: PATCH
        DecideSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}/grades/{gradeRecordId}/verification
            Method: POST
        GetStudentGraduationCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}
            Method: GET
        ListGraduationImportBatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/import-batches
            Method: GET
        TuLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/logout
            Method: POST
        AuthMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/me
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-auth'
      ReservedConcurrentExecutions: !If [HasAuthReservation, !Ref AuthReservedConcurrency, !Ref 'AWS::NoValue']
      LoggingConfig:
        LogGroup: !Ref AuthFunctionLogGroup
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.authHandler
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        TuLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/login
            Method: POST
            RouteSettings:
              ThrottlingRateLimit: 2
              ThrottlingBurstLimit: 5
        StudentProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/profile/student
            Method: GET

  DbInitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-dbinit'
      RetentionInDays: !Ref LogRetentionDays

  # Not exposed through the API. Invoked by hand with aws lambda invoke (see docs/learner-lab-runbook.md)
  DbInitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dbinit'
      LoggingConfig:
        LogGroup: !Ref DbInitLogGroup
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/db-init.handler
      Timeout: 300
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          DB_DIRECT_HOST: !Ref DbHost

  ImportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-import'
      RetentionInDays: !Ref LogRetentionDays

  ImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-import'
      LoggingConfig:
        LogGroup: !Ref ImportLogGroup
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/import-handler.handler
      Timeout: 900
      MemorySize: 1024
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          COURSE_API_URL_CS: !Ref CourseApiUrlCs
          COURSE_API_URL_CNC: !Ref CourseApiUrlCnc

Outputs:
  ApiUrl:
    Description: Base URL for the deployed HTTP API
    Value: !Sub "https://${CurriculumApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  RdsProxyEndpoint:
    Condition: UseProxy
    Description: RDS Proxy endpoint used by Lambda
    Value: !GetAtt CurriculumDbProxy.Endpoint
  DbInitFunctionName:
    Description: Invoke once to create the database, import the dump and create the app user
    Value: !Ref DbInitFunction
  ImportFunctionName:
    Description: Manually invoked curriculum importer with dry-run support
    Value: !Ref ImportFunction
  ApiId:
    Description: HTTP API id, used in the Amplify /api rewrite target
    Value: !Ref CurriculumApi
