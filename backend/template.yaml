AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CS361 curriculum read API backed by Amazon RDS MySQL through RDS Proxy

Parameters:
  DbHost:
    Type: String
    Description: RDS instance endpoint hostname (used by the proxy target)
  DbInstanceIdentifier:
    Type: String
    Description: Existing RDS DB instance identifier to attach to the proxy
  DbName:
    Type: String
    Default: curriculum
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbPort:
    Type: Number
    Default: 3306
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets that can reach the RDS instance
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to Lambda; allow it in the RDS security group on port 3306
  RdsProxySecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for RDS Proxy; allow inbound MySQL from the Lambda security group
  LambdaExecutionRoleArn:
    Type: String
    Description: Existing IAM execution role ARN for Lambda
  RdsProxyRoleArn:
    Type: String
    Description: Existing IAM role ARN trusted by rds.amazonaws.com and allowed to read the database secret
  TuApplicationKey:
    Type: String
    NoEcho: true
    Description: TU API Application-Key for Authentication Service
  TuAuthUrl:
    Type: String
    Default: https://restapi.tu.ac.th/api/v1/auth/Ad/verify2
  FrontendOrigin:
    Type: String
    Default: https://main.d3dm5h9pinlgfm.amplifyapp.com
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign short-lived API access tokens
  DemoTeacherPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoInstructorPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoStaffPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoAdminPasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  EnableDemoLogin:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  DemoStudent01PasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  DemoStudent02PasswordHash:
    Type: String
    NoEcho: true
    Default: ''
  GraduationSnapshotMaxAgeDays:
    Type: Number
    Default: 30
    Description: Days after which graduation grade data counts as stale (V4)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 28
    MemorySize: 256
    Environment:
      Variables:
        DB_HOST: !GetAtt CurriculumDbProxy.Endpoint
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        TU_APPLICATION_KEY: !Ref TuApplicationKey
        TU_AUTH_URL: !Ref TuAuthUrl
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        JWT_SECRET: !Ref JwtSecret
        JWT_ISSUER: cs361-curriculum-api
        JWT_AUDIENCE: cs361-frontend
        DB_TLS: 'true'
        DEMO_TEACHER_PASSWORD_HASH: !Ref DemoTeacherPasswordHash
        DEMO_INSTRUCTOR_PASSWORD_HASH: !Ref DemoInstructorPasswordHash
        DEMO_STAFF_PASSWORD_HASH: !Ref DemoStaffPasswordHash
        DEMO_ADMIN_PASSWORD_HASH: !Ref DemoAdminPasswordHash
        ENABLE_DEMO_LOGIN: !Ref EnableDemoLogin
        DEMO_STUDENT_01_PASSWORD_HASH: !Ref DemoStudent01PasswordHash
        DEMO_STUDENT_02_PASSWORD_HASH: !Ref DemoStudent02PasswordHash
        GRADUATION_SNAPSHOT_MAX_AGE_DAYS: !Ref GraduationSnapshotMaxAgeDays

Resources:
  CurriculumDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Credentials used by the CS361 RDS Proxy
      SecretString: !Sub '{"username":"${DbUser}","password":"${DbPassword}"}'

  CurriculumDbProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: cs361-curriculum-proxy
      EngineFamily: MYSQL
      Auth:
        - AuthScheme: SECRETS
          IAMAuth: DISABLED
          SecretArn: !Ref CurriculumDbSecret
      RoleArn: !Ref RdsProxyRoleArn
      VpcSubnetIds: !Ref VpcSubnetIds
      VpcSecurityGroupIds:
        - !Ref RdsProxySecurityGroupId
      RequireTLS: true

  CurriculumDbProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref CurriculumDbProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref DbInstanceIdentifier
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50

  CurriculumApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
          - x-cs361-csrf
        AllowCredentials: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  CurriculumReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.handler
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        CreateDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests
            Method: POST
        ListDraftChangeRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests
            Method: GET
        GetDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}
            Method: GET
        SaveDraftChangeItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/items
            Method: PUT
        SubmitDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/submit
            Method: POST
        DeleteDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}
            Method: DELETE
        CancelDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/cancel
            Method: POST
        DecideDraftChangeRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/change-requests/{requestId}/decision
            Method: POST
        GetActivePlanForDraft:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/active-plan
            Method: GET
        ListCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses
            Method: GET
        GetCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}
            Method: GET
        GetPrerequisites:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}/prerequisites
            Method: GET
        GetGraduationConditions:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/graduation-conditions
            Method: GET
        ListStudyPlans:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans
            Method: GET
        GetStudyPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans/{studyPlanId}
            Method: GET
        ListFaculties:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/faculties
            Method: GET
        ListDepartments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/departments
            Method: GET
        ListAuditLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/audit-logs
            Method: GET
        GetCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: GET
        ListCurricula:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula
            Method: GET
        UpdateCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: POST
        SetCurriculumVisibility:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/visibility
            Method: PATCH
        DeleteCurriculum:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}
            Method: DELETE
        DeleteCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseCode}
            Method: DELETE
        ListCurriculumChanges:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes
            Method: GET
        CreateCurriculumChange:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes
            Method: POST
        DecideCurriculumChange:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curriculum-changes/{changeId}/decision
            Method: POST
        GetMyGraduationCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me
            Method: GET
        ListAssignedGraduationStudents:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students
            Method: GET
        AssignGraduationStudent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments
            Method: POST
        ListGraduationAssignments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments
            Method: GET
        ListGraduationDirectory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/directory
            Method: GET
        RemoveGraduationStudent:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/assignments/{studentId}
            Method: DELETE
        AddSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/grades
            Method: POST
        DeleteSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/me/grades/{gradeRecordId}
            Method: DELETE
        DecideSelfReportedGrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}/grades/{gradeRecordId}/verification
            Method: POST
        GetStudentGraduationCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/students/{studentId}
            Method: GET
        ListGraduationImportBatches:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/graduation/import-batches
            Method: GET
        TuLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/logout
            Method: POST
        AuthMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/me
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.authHandler
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        TuLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/login
            Method: POST
            RouteSettings:
              ThrottlingRateLimit: 2
              ThrottlingBurstLimit: 5
        StudentProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/profile/student
            Method: GET

Outputs:
  ApiUrl:
    Description: Base URL for the deployed HTTP API
    Value: !Sub "https://${CurriculumApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  RdsProxyEndpoint:
    Description: RDS Proxy endpoint used by Lambda
    Value: !GetAtt CurriculumDbProxy.Endpoint
