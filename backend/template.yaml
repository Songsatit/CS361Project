AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CS361 curriculum read API backed by Amazon RDS MySQL

Parameters:
  DbHost:
    Type: String
    Description: RDS endpoint hostname (without port)
  DbName:
    Type: String
    Default: curriculum
  DbUser:
    Type: String
  DbPassword:
    Type: String
    NoEcho: true
  DbPort:
    Type: Number
    Default: 3306
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets that can reach the RDS instance
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to Lambda; allow it in the RDS security group on port 3306
  LambdaExecutionRoleArn:
    Type: String
    Description: Existing IAM execution role ARN for Lambda
  TuApplicationKey:
    Type: String
    NoEcho: true
    Description: TU API Application-Key for Authentication Service
  TuAuthUrl:
    Type: String
    Default: https://restapi.tu.ac.th/api/v1/auth/Ad/verify2

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 28
    MemorySize: 256
    Environment:
      Variables:
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        TU_APPLICATION_KEY: !Ref TuApplicationKey
        TU_AUTH_URL: !Ref TuAuthUrl

Resources:
  CurriculumApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  CurriculumReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.handler
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Events:
        ListCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses
            Method: GET
        GetCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}
            Method: GET
        GetPrerequisites:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/courses/{courseId}/prerequisites
            Method: GET
        GetGraduationConditions:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/graduation-conditions
            Method: GET
        ListStudyPlans:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans
            Method: GET
        GetStudyPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/study-plans/{studyPlanId}
            Method: GET
        ListFaculties:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/faculties
            Method: GET
        ListDepartments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/departments
            Method: GET
        ListAuditLogs:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/audit-logs
            Method: GET
        GetCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: GET
        UpdateCurriculumWorkflow:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/curricula/{curriculumId}/workflow
            Method: POST

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Ref LambdaExecutionRoleArn
      CodeUri: .
      Handler: src/api.authHandler
      Events:
        TuLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CurriculumApi
            Path: /api/auth/login
            Method: POST

Outputs:
  ApiUrl:
    Description: Base URL for the deployed HTTP API
    Value: !Sub "https://${CurriculumApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
